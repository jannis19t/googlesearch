<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search | Pokročilé hledání</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <header class="site-header">
        <div class="container nav">
            <a class="brand" href="index.html">
                <span class="brand-mark">{/}</span>
                <span class="brand-name">jannis<span>.dev</span></span>
            </a>
            <nav class="nav-menu">
                <a class="nav-link" href="index.html">Web</a>
                <a class="nav-link" href="image.html">Obrázky</a>
            </nav>
        </div>
    </header>

    <main class="advanced">
        <div class="advanced-header">
            <p class="eyebrow">03 / POKROČILÉ HLEDÁNÍ</p>
            <h1 class="logo">Pokročilé <em>hledání</em></h1>
        </div>
        <h2>Najdi přesně to, co hledáš</h2>

        <div class="advanced-form">
            <form action="https://www.google.com/search" method="get">
                <h3>Najdi stránky s…</h3>

                <label for="as_q">všemi těmito slovy:</label>
                <input type="text" id="as_q" name="as_q">

                <label for="as_epq">touto přesnou frází nebo slovem:</label>
                <input type="text" id="as_epq" name="as_epq">

                <label for="as_oq">kterýmkoli z těchto slov:</label>
                <input type="text" id="as_oq" name="as_oq">

                <label for="as_eq">žádným z těchto slov:</label>
                <input type="text" id="as_eq" name="as_eq">

                <input type="submit" value="Pokročilé hledání" class="blue-button">
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <a class="brand" href="index.html">
                    <span class="brand-mark">{/}</span>
                    <span class="brand-name">jannis<span>.dev</span></span>
                </a>
                <p>Navrženo a vytvořeno s <span>♥</span> a kávou.</p>
            </div>
            <div class="footer-bottom">
                <span>© 2026 Jannis</span>
                <div class="validator-links">
                    <a class="validator-link"
                        href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fjannis.tech%2Fgooglesearch%2Findex.html"
                        target="_blank" rel="noopener">HTML validátor</a>
                    <a class="validator-link"
                        href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fjannis.tech%2Fgooglesearch%2Fstyle.css"
                        target="_blank" rel="noopener">CSS validátor</a>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
